name: CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  delivery:
    name: Prepare delivery package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare site package
        run: |
          mkdir -p dist
          cp index.html dist/
          cp script.js dist/

      - name: Upload delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: gerador-senhas-site
          path: dist/
          retention-days: 7